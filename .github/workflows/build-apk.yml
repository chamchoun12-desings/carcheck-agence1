name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cherche, n'importe où dans le dépôt, un zip qui contient le projet (quel que soit son nom)
      - name: Déballer projet.zip
        run: |
          Z=""
          while IFS= read -r -d '' f; do
            if unzip -l "$f" 2>/dev/null | grep -q 'android/settings.gradle'; then Z="$f"; break; fi
          done < <(find . -path ./.git -prune -o -type f -iname '*.zip' -print0)
          if [ -n "$Z" ]; then
            echo "Déballage de $Z"
            cp "$Z" /tmp/projet.zip
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
            unzip -oq /tmp/projet.zip -x '.github/*'
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A
            git reset -q -- .github
            if ! git diff --cached --quiet; then git commit -m "Déballer projet.zip" && git push; fi
            case "$Z" in ./.github/*) echo "::warning::$Z est dans le dossier .github : supprimez-le à la main sur GitHub.";; esac
          fi
          # Projet envoyé en dossier (ex. projet/server, projet/android) : on le remonte à la racine
          if [ ! -d android ]; then
            S=$(find . -path ./.git -prune -o -type f -path '*/android/settings.gradle' -print | head -n 1)
            if [ -n "$S" ]; then
              D=$(dirname "$(dirname "$S")")
              echo "Projet trouvé dans $D"
              shopt -s dotglob
              for x in "$D"/*; do
                n=$(basename "$x")
                if [ "$n" = ".github" ]; then continue; fi
                rm -rf "./$n"
                mv "$x" "./$n"
              done
              rm -rf "$D"
              git config user.name "github-actions[bot]"
              git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
              git add -A
              git reset -q -- .github
              if ! git diff --cached --quiet; then git commit -m "Ranger le projet à la racine" && git push; fi
            fi
          fi
          if [ ! -d server ] || [ ! -d android ]; then
            echo "Aucun zip du projet trouvé. Fichiers présents dans le dépôt :"
            find . -path ./.git -prune -o -type f -print
            echo "::error::Dossiers server/ et android/ absents. Envoyez projet.zip (Add file > Upload files), la fabrication repartira toute seule."
            exit 1
          fi

      - name: Tests du serveur
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python3 server/tests/run_tests.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construire l'APK
        run: |
          # l'application du téléphone utilise exactement la même page que le serveur
          cp server/carcheck/static/agence.html android/app/src/main/assets/agence.html
          cd android && gradle assembleDebug --no-daemon

      - name: Préparer les fichiers
        run: |
          mkdir out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/CarCheck.apk
          (cd server && zip -rq ../out/carcheck-serveur.zip . -x '*/__pycache__/*')

      - uses: actions/upload-artifact@v4
        with:
          name: CarCheck
          path: out/

      - name: Publier dans Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.${{ github.run_number }}" out/CarCheck.apk out/carcheck-serveur.zip \
            --target "$(git rev-parse HEAD)" \
            --title "Car Check v0.${{ github.run_number }}" \
            --notes "APK de test (Android 7+) et serveur. Fabriqué automatiquement par GitHub."
