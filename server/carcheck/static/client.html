<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Réserver une voiture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: page client autonome (lien web), une question par écran, même système visuel que l'app agence, accent sarcelle */
:root{--bg:#eef2f3;--app:#f8fafa;--card:#fff;--ink:#14202a;--mute:#5a6874;--line:#d6dde1;--acc:#0f7c74;--acc-soft:#dff2ef;--bad:#d6336c;--bad-soft:#fde4ec;
 --font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;--font-ar:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1214;--app:#11191c;--card:#182226;--ink:#e6eef0;--mute:#97a5ab;--line:#29363b;--acc:#3cc2b5;--acc-soft:#123331;--bad:#f06595;--bad-soft:#3b1828;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1214;--app:#11191c;--card:#182226;--ink:#e6eef0;--mute:#97a5ab;--line:#29363b;--acc:#3cc2b5;--acc-soft:#123331;--bad:#f06595;--bad-soft:#3b1828;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
[dir="rtl"]{font-family:var(--font-ar)}
.app{max-width:430px;margin:12px auto 28px;background:var(--app);min-height:720px;border:1px solid var(--line);border-radius:26px;overflow:hidden;display:flex;flex-direction:column}
@media (max-width:460px){.app{margin:0;border-radius:0;border-left:0;border-right:0;min-height:100vh}}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--acc);color:#fff}
.top .who{flex:1}.top b{display:block;font-size:1.1rem}.top span{font-size:.82rem;opacity:.85}
.pill-btn{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:99px;padding:8px 14px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;min-height:40px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer}
[dir="rtl"] .iconbtn svg{transform:scaleX(-1)}
main{flex:1;padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.5rem;line-height:1.2;margin:0;text-wrap:balance}
.sub{color:var(--mute);margin:0;font-size:.95rem}
button{font-family:inherit}:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.prog{display:flex;gap:5px}.prog i{flex:1;height:7px;border-radius:4px;background:var(--line)}.prog i.on{background:var(--acc)}
.field{display:grid;gap:6px}.field label{font-weight:600;font-size:.95rem}
input[type=text],input[type=tel],input[type=date]{width:100%;font:inherit;font-size:1.1rem;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:56px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:14px;min-height:56px;font-size:1.05rem;font-weight:600;color:var(--ink);cursor:pointer}
.seg button.sel{border-color:var(--acc);background:var(--acc-soft)}
.carcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px;cursor:pointer;text-align:start;color:var(--ink)}
.carcard.sel{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.carcard .pic{width:64px;height:44px;border-radius:10px;background:var(--acc-soft);display:grid;place-items:center;color:var(--acc)}
.carcard b{display:block;font-size:1.1rem}.carcard span{color:var(--mute);font-size:.88rem}
.carcard .price{text-align:end}.carcard .price b{font-size:1.25rem}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border:0;border-radius:18px;font-size:1.2rem;font-weight:700;cursor:pointer;color:#fff;background:var(--acc)}
.big:disabled{opacity:.4;cursor:not-allowed}
.big.light{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.spacer{flex:1}.footer{position:sticky;bottom:0;padding-top:8px;background:linear-gradient(transparent,var(--app) 30%)}
.cam{display:flex;align-items:center;gap:14px;border:2px dashed var(--line);border-radius:16px;padding:14px;background:var(--card);cursor:pointer;color:var(--ink);font-size:1.05rem;font-weight:600;width:100%;text-align:start}
.cam .ic{width:52px;height:52px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.cam.ok{border-style:solid;border-color:var(--acc);background:var(--acc-soft)}
.cam.ok .ic{background:var(--acc)}
.okmsg{display:flex;gap:10px;align-items:center;font-weight:600;color:var(--acc)}
.badmsg{border-radius:14px;padding:12px 14px;background:var(--bad-soft);color:var(--bad);font-weight:600}
.consent{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.92rem}
.consent input{width:26px;height:26px;flex:none;margin-top:2px}
.summary{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:6px}
.summary b{font-size:1.15rem}
.done{display:grid;place-items:center;text-align:center;gap:14px;padding:16px 0}
.done .ic{width:104px;height:104px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center}
.status{display:inline-block;border-radius:99px;padding:6px 14px;font-weight:700;background:#fdf0d8;color:#a35f00}
.example{align-self:flex-start;font-size:.75rem;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
.status.ok{background:var(--acc-soft);color:var(--acc)}.status.bad{background:var(--bad-soft);color:var(--bad)}
.spin{width:54px;height:54px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--acc);animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.price-big{font-size:1.6rem;font-weight:700}
.app{min-height:100vh}@media (min-width:461px){.app{min-height:720px}}
</style></head>
<body data-agency="{{AGENCY}}"><div class="app" id="app" aria-live="polite"></div>
<script>
/* Page client : réserver en 4 étapes (dates, voiture, coordonnées, papiers), puis suivre sa demande. */
const T={
fr:{lang:"عربي",tag:"Réservez en 4 étapes",back:"Précédent",next:"Suivant",step:(a,b)=>`Étape ${a} sur ${b}`,

 qCar:"Choisissez une voiture",carsHint:"Voitures libres à vos dates. L’agence vous envoie le prix sur WhatsApp.",none:"Aucune voiture libre à ces dates. Essayez d’autres dates.",

 front:"CIN · recto",backS:"CIN · verso",passPage:"Passeport · page photo",lic:"Permis de conduire",licUntil:"Mon permis est valable jusqu’au",passUntil:"Mon passeport est valable jusqu’au",

 qCar:"اختر سيارة",carsHint:"السيارات الشاغرة في تواريخك. ترسل لك الوكالة السعر على واتساب.",none:"لا توجد سيارة شاغرة في هذه التواريخ. جرّب تواريخ أخرى.",

 qYou:"معلوماتك",name:"الاسم واللقب",phone:"رقم الواتساب",msgLang:"الرسائل باللغة",
 qDocs:"وثائقك",docsHint:"التقط صورة واضحة. ستُظهر الوثائق الأصلية في الوكالة.",cin:"بطاقة التعريف",pass:"جواز السفر",
 front:"بطاقة التعريف · الوجه",backS:"بطاقة التعريف · الظهر",passPage:"جواز السفر · صفحة الصورة",lic:"رخصة السياقة",licUntil:"رخصتي صالحة إلى غاية",passUntil:"جوازي صالح إلى غاية",
 take:"التقط الصورة",taken:"تمّ التقاط الصورة ✓",

 licBad:"رخصتك لن تكون صالحة عند نهاية الكراء.",send:"أرسل طلبي",sending:"جاري الإرسال…",
 st:{pending:"في انتظار ردّ الوكالة",confirmed:"تمّ القبول ✓",refused:"مرفوض",cancelled:"ملغى",converted:"تمّ تسليم السيارة ✓"},
 sentT:"طلبك",pendingL:"تتثبّت الوكالة من وثائقك وتجيبك على واتساب مع السعر. السيارة محجوزة لك في الانتظار.",
 confirmedL:"تمّ القبول. تعال إلى الوكالة بوثائقك الأصلية.",refusedL:"نعتذر، السيارة غير متوفّرة. جرّب تواريخ أخرى.",
 cancelledL:"هذا الطلب ملغى.",priceL:(d,p)=>`${d} × ${p} دينار`,keep:"احتفظ بهذا الرابط لمتابعة طلبك.",again:"حجز جديد",
 cancel:"إلغاء طلبي",cancelQ:"إلغاء هذا الطلب؟",yesCancel:"نعم، ألغِ",no:"لا",docsRedo:"تطلب الوكالة إعادة إرسال وثائقك:",
 offline:"لا يوجد اتصال. أعد المحاولة.",err:"خطأ، أعد المحاولة.",retry:"إعادة المحاولة",d7:["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"]}};
const I={back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 car:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14l1.6-4.5A2 2 0 017.5 8h9a2 2 0 011.9 1.5L20 14"/><rect x="3" y="14" width="18" height="4" rx="1"/><circle cx="7" cy="18" r="1.4"/><circle cx="17" cy="18" r="1.4"/></svg>',
 cam:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
 ok:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
 big:'<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'};
const AGENCY=document.body.dataset.agency||"";
const p2=n=>String(n).padStart(2,"0"),iso=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`,plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}};
const token=new URLSearchParams(location.search).get("suivi");
let S={lang:lsGet("cc-lang-client",(navigator.language||"fr").startsWith("ar")?"ar":"fr"),step:0,a:plus(1),b:plus(4),cars:null,car:null,name:"",tel:"",ml:null,
 id:"cin",files:{},thumbs:{},lic:"",pex:"",ok:false,busy:false,err:"",res:null,ask:false,docs:true};
const $=s=>document.querySelector(s),t=()=>T[S.lang];
const nd=()=>Math.max(0,Math.round((new Date(S.b)-new Date(S.a))/864e5));
const nice=v=>{const d=typeof v==="number"?new Date(v*1000):new Date(v+"T10:00");return`${t().d7[d.getDay()]} ${p2(d.getDate())}/${p2(d.getMonth()+1)}`};
async function call(url,opt){try{const r=await fetch(url,opt);let j={};try{j=await r.json()}catch(e){}return{ok:r.ok&&j.ok!==false,j,err:j.error||t().err}}catch(e){return{ok:false,j:{},err:t().offline}}}

function screen(){const L=t(),N=4;let h="",ok=true,label=L.next;
 if(token){const r=S.res;if(!r)return S.err?`<div class="badmsg">${esc(S.err)}</div><button class="big" data-act="reload">${L.retry}</button>`:`<div class="spin"></div>`;
  const cls=r.status==="confirmed"||r.status==="converted"?"ok":r.status==="pending"?"":"bad";
  return`<div class="done"><span class="ic">${I.big}</span><h1>${L.sentT}</h1><span class="status ${cls}">${L.st[r.status]||r.status}</span></div>
   <div class="summary"><b>${esc(r.car_name)}</b><span>${nice(r.start)} → ${nice(r.end)} · ${L.days(r.days)}</span>
    ${r.total?`<span class="price-big" dir="ltr" style="justify-self:start">${r.total} DT</span><span class="sub">${L.priceL(r.days,r.price_day)}</span>`:""}</div>
   ${r.docs_status==="rejected"&&r.docs_note?`<div class="badmsg">${L.docsRedo} ${esc(r.docs_note)}</div>`:""}
   <p class="sub">${{pending:L.pendingL,confirmed:L.confirmedL,converted:L.confirmedL,refused:L.refusedL,cancelled:L.cancelledL}[r.status]||""}</p><p class="sub">${L.keep}</p>
   <div class="spacer"></div>${r.can_cancel?(S.ask?`<p><b>${L.cancelQ}</b></p><div class="two"><button class="big" style="background:var(--bad)" data-act="docancel">${L.yesCancel}</button><button class="big light" data-act="nocancel">${L.no}</button></div>`
    :`<button class="big light" data-act="cancel">${L.cancel}</button>`):""}<a class="big light" href="/reserver" style="text-decoration:none">${L.again}</a>`}
 if(S.step===0){const past=S.a<iso(new Date());ok=nd()>0&&!past;h=`<h1>${L.qDates}</h1><div class="field"><label for="a">${L.from}</label><input id="a" type="date" min="${iso(new Date())}" value="${S.a}"></div>
  <div class="field"><label for="b">${L.to}</label><input id="b" type="date" min="${S.a}" value="${S.b}"></div>${past?`<div class="badmsg">${L.pastDate}</div>`:ok?`<div class="okmsg">${I.ok}${L.days(nd())}</div>`:`<div class="badmsg">${L.badDates}</div>`}`}
 if(S.step===1){ok=!!S.car;const cs=S.cars;
  h=`<h1>${L.qCar}</h1><p class="sub">${nice(S.a)} → ${nice(S.b)} · ${L.days(nd())}</p><p class="sub">${L.carsHint}</p>
  ${cs===null?`<div class="spin"></div>`:cs.length?cs.map(c=>`<button class="carcard ${S.car===c.plate?"sel":""}" data-car="${esc(c.plate)}"><span class="pic">${I.car}</span><span><b>${esc(c.name)}</b><span>${esc(L.cats[c.category]||c.category||"")}</span></span><span></span></button>`).join("")
   :`<div class="badmsg">${L.none}</div>`}`}
 if(S.step===2){const ml=S.ml||S.lang;ok=S.name.trim().length>1&&S.tel.replace(/\D/g,"").length>=8;h=`<h1>${L.qYou}</h1>
  <div class="field"><label for="n">${L.name}</label><input id="n" type="text" value="${esc(S.name)}" autocomplete="name"></div>
  <div class="field"><label for="tl">${L.phone}</label><input id="tl" type="tel" dir="ltr" value="${esc(S.tel)}" placeholder="+216 98 000 000" autocomplete="tel"></div>
  <div class="field"><label>${L.msgLang}</label><div class="seg"><button data-ml="fr" class="${ml==="fr"?"sel":""}">Français</button><button data-ml="ar" class="${ml==="ar"?"sel":""}">العربية</button></div></div>
  <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">`}
 if(S.step===3){const need=S.id==="cin"?["id_front","id_back","license_front"]:["id_front","license_front"];const bad=S.lic&&S.lic<S.b,pbad=S.id==="passport"&&S.pex&&S.pex<S.b;
  ok=(!S.docs||(need.every(k=>S.files[k])&&S.lic&&!bad&&(S.id!=="passport"||(S.pex&&!pbad))&&S.ok))&&!S.busy;label=S.busy?L.sending:L.send;
  const cam=(k,l)=>`<button class="cam ${S.files[k]?"ok":""}" data-ph="${k}">${S.thumbs[k]?`<img class="thumb" src="${S.thumbs[k]}" alt="">`:`<span class="ic">${I.cam}</span>`}<span>${l}<br><small style="font-weight:500;color:var(--mute)">${S.files[k]?L.taken:L.take}</small></span></button>`;
  h=`<h1>${L.qDocs}</h1><p class="sub">${L.docsHint}</p><div class="seg"><button data-id="cin" class="${S.id==="cin"?"sel":""}">${L.cin}</button><button data-id="passport" class="${S.id==="passport"?"sel":""}">${L.pass}</button></div>
  ${S.id==="cin"?cam("id_front",L.front)+cam("id_back",L.backS):cam("id_front",L.passPage)}
  ${S.id==="passport"?`<div class="field"><label for="pex">${L.passUntil}</label><input id="pex" type="date" value="${S.pex}"></div>`:""}
  ${cam("license_front",L.lic)}
  <div class="field"><label for="lc">${L.licUntil}</label><input id="lc" type="date" value="${S.lic}"></div>${bad?`<div class="badmsg">${L.licBad}</div>`:""}
  <label class="consent"><input type="checkbox" id="ok" ${S.ok?"checked":""}><span>${L.consent}</span></label>`}
 return`<div class="prog">${Array.from({length:N},(_,i)=>`<i class="${i<=S.step?"on":""}"></i>`).join("")}</div><div class="sub">${L.step(S.step+1,N)}</div>${h}
  ${S.err?`<div class="badmsg">${esc(S.err)}</div>`:""}<div class="spacer"></div><div class="footer"><button class="big" data-act="next" ${ok?"":"disabled"}>${label}</button></div>`}
function render(){const L=t();document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
 $("#app").innerHTML=`<header class="top">${!token&&S.step>0?`<button class="iconbtn" data-act="back" aria-label="${L.back}">${I.back}</button>`:""}
  <div class="who"><b>${esc(AGENCY)}</b><span>${L.tag}</span></div><button class="pill-btn" data-act="lang">${L.lang}</button></header><main>${screen()}</main>`;
 const on=(id,fn,ev="input")=>{const e=$(id);if(e)e.addEventListener(ev,()=>{fn(e.value,e);upd()})};
 on("#a",v=>{S.a=v;S.cars=null;S.car=null},"change");on("#b",v=>{S.b=v;S.cars=null;S.car=null},"change");on("#n",v=>S.name=v);on("#tl",v=>S.tel=v);
 on("#lc",v=>S.lic=v,"change");on("#pex",v=>S.pex=v,"change");on("#ok",(v,e)=>S.ok=e.checked,"change")}
function upd(){const keep=document.activeElement&&document.activeElement.id;const pos=keep&&document.activeElement.selectionStart;render();
 if(keep){const e=$("#"+keep);if(e){e.focus();try{if(pos!=null)e.setSelectionRange(pos,pos)}catch(_){}}}}
async function loadCars(){S.cars=null;S.err="";render();const r=await call(`/api/public/cars?start=${S.a}&end=${S.b}`);
 if(!r.ok){S.err=r.err;S.cars=[];S.step=0}else{S.cars=r.j.cars;S.docs=r.j.docs_required!==false}render()}
async function send(){S.busy=true;S.err="";render();const fd=new FormData();
 const f={car:S.car,start:S.a,end:S.b,name:S.name.trim(),phone:S.tel,lang:S.ml||S.lang,website:($("#website")||{}).value||"",id_type:S.id,license_expiry:S.lic,id_expiry:S.id==="passport"?S.pex:"",consent:S.ok?"1":""};
 for(const k in f)fd.append(k,f[k]);for(const k in S.files)if(S.files[k])fd.append(k,S.files[k]);
 const r=await call("/api/public/book",{method:"POST",body:fd});S.busy=false;
 if(r.ok){location.replace("/reserver?suivi="+encodeURIComponent(r.j.token));return}S.err=r.err;render()}
async function loadRes(){S.err="";const r=await call(`/api/public/res/${encodeURIComponent(token)}`);if(r.ok)S.res=r.j;else S.err=r.err;render()}
document.addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b||b.disabled)return;const a=b.dataset.act;
 if(a==="lang"){S.lang=S.lang==="fr"?"ar":"fr";try{localStorage.setItem("cc-lang-client",S.lang)}catch(_){}render();return}
 if(a==="back"){S.step=Math.max(0,S.step-1);S.err="";render();return}
 if(a==="reload"){loadRes();return}
 if(a==="next"){if(S.step===3){send();return}S.step++;S.err="";if(S.step===1)loadCars();else render();window.scrollTo(0,0);return}
 if(a==="cancel"){S.ask=true;render();return}if(a==="nocancel"){S.ask=false;render();return}
 if(a==="docancel"){const r=await call(`/api/public/res/${encodeURIComponent(token)}/cancel`,{method:"POST"});S.ask=false;if(!r.ok)S.err=r.err;loadRes();return}
 if(b.dataset.car){S.car=b.dataset.car;render();return}
 if(b.dataset.ml){S.ml=b.dataset.ml;render();return}
 if(b.dataset.id){S.id=b.dataset.id;S.files={};S.thumbs={};render();return}
 if(b.dataset.ph){const k=b.dataset.ph,inp=document.createElement("input");inp.type="file";inp.accept="image/*,application/pdf";inp.style.display="none";document.body.appendChild(inp);
  inp.onchange=()=>{const f=inp.files[0];inp.remove();if(!f)return;S.files[k]=f;S.thumbs[k]=f.type.startsWith("image/")?URL.createObjectURL(f):"";render()};inp.click();return}});
render();if(token)loadRes();

</script></body></html>
